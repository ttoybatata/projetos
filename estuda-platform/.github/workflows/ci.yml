name: Estuda CI
on:
  pull_request:
    paths: ["estuda-platform/**"]
  push:
    branches: [main]
    paths: ["estuda-platform/**"]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estuda-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estuda-platform/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:3000