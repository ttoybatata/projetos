name: Estuda CI
on:
  pull_request:
    paths:
      - "estuda-platform/**"
      - ".github/workflows/estuda-ci.yml"
  push:
    branches: [main]
    paths:
      - "estuda-platform/**"
      - ".github/workflows/estuda-ci.yml"
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estuda-platform
    env:
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-test-secret-with-more-than-32-characters"
      PORT: "3000"
      WEB_ORIGIN: "http://127.0.0.1:5173"
      VITE_API_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
