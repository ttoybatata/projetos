name: Estuda CI
on:
  pull_request:
    paths:
      - "estuda-platform/**"
      - ".github/workflows/estuda-ci.yml"
  push:
    branches: [main]
    paths:
      - "estuda-platform/**"
      - ".github/workflows/estuda-ci.yml"
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estuda
          POSTGRES_PASSWORD: estuda-ci-password
          POSTGRES_DB: estuda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estuda -d estuda_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: estuda-platform
    env:
      DATABASE_URL: "postgresql://estuda:estuda-ci-password@localhost:5432/estuda_ci?schema=public"
      JWT_SECRET: "ci-test-secret-with-more-than-32-characters"
      PORT: "3000"
      WEB_ORIGIN: "http://127.0.0.1:5173"
      VITE_API_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report npm audit advisories
        run: |
          npm audit --json > /tmp/estuda-npm-audit.json || true
          node -e 'const audit = require("/tmp/estuda-npm-audit.json"); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === "string" ? v : { name: v.name, title: v.title, url: v.url, range: v.range }) }));'
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Explore rendered page with Microsoft's Playwright CLI
        run: |
          PORT=3001 WEB_ORIGIN=http://127.0.0.1:5174 npm run dev:api > /tmp/estuda-api.log 2>&1 &
          API_PID=$!
          PORT=3001 WEB_ORIGIN=http://127.0.0.1:5174 VITE_API_URL=http://127.0.0.1:3001 npm run dev:web -- --port 5174 > /tmp/estuda-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null && curl -fsS http://127.0.0.1:5174 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health
          npm run browser:help
          npx playwright-cli open http://127.0.0.1:5174
          npx playwright-cli snapshot | tee /tmp/estuda-cli-snapshot.txt
          grep -q "Vamos começar?" /tmp/estuda-cli-snapshot.txt
          npx playwright-cli close
      - run: npm run test:e2e
        env:
          CI: true
