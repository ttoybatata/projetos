databases:
  - name: estuda-postgres
    plan: free
    databaseName: estuda_postgres
    user: estuda_postgres_user

services:
  - type: web
    name: estuda-web
    runtime: docker
    plan: free
    rootDir: estuda-platform
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estuda-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
